<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Congo × Impeccable</title><link rel="stylesheet" href="/native.css"><link rel="stylesheet" href="/workspace.css"><script type="module" src="/workspace.js"></script></head>
<body class="workspace-host">
  <nav class="workspace-nav" aria-label="Workspace views"><button id="choices-tab" aria-pressed="true">Choices</button><button id="live-tab" aria-pressed="false">Live App</button><span id="connection" role="status">Checking connection</span><button id="library-toggle" aria-expanded="true" aria-controls="library">Library</button></nav>
  <div class="workspace-surfaces"><div class="native-views"><iframe id="choices-frame" class="native-pane" src="/native-choices" title="Impeccable Choices" referrerpolicy="no-referrer"></iframe><iframe id="live-frame" class="native-pane" title="Your app with Impeccable live editing" referrerpolicy="no-referrer" hidden></iframe><p id="app-state" hidden>No running app attached. Continue in your existing AI chat.</p></div>
    <aside id="library" aria-label="Congo library"><h2>Library</h2><form id="search"><label for="query">Search Congo</label><input id="query" type="search" placeholder="Contacts, invoicing, settings…"><div><select id="kind" aria-label="Library type"><option value="screen">Screens</option><option value="template">Templates</option><option value="handbook">Handbooks</option></select><button type="submit">Search</button></div></form><p id="library-state" role="status"></p><div id="results"></div><button id="more" hidden>Load more</button><p class="source-policy">Previews are free. Source uses your existing Congo sign-in and subscription.</p></aside>
  </div><p id="notice" role="status" hidden></p>
</body></html>
